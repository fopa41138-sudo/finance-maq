crons:
  - name: bank-daily-sync
    description: "Atualiza todo dia às 6h (Brasília) o extrato de todos os bancos conectados no Pluggy"
    cron: "0 6 * * *"
    timezone: "America/Sao_Paulo"
    endpoint: "{{BASE_URL}}/api/cron/bank-sync"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
